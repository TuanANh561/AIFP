# ============================================================================
# Local Standalone Development Profile (Embedded Persistent H2 in PostgreSQL Mode)
# Allows backend-core to run 100% out of the box with zero external DB dependencies
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:file:./data/aifp_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration


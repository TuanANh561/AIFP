spring:
  datasource:
    url: jdbc:h2:mem:aifp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 3025

aifp:
  security:
    jwt-secret: test_only_jwt_signing_secret_minimum_64_bytes_long_for_hs256_validation_2026
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
    internal-shared-secret: test_only_internal_shared_secret_hmac_sha256_between_spring_and_python
    rate-limit-per-minute: 500

